# Escritorio Windows dentro de la VPC para abrir Argo CD y Dapr Dashboard con Fleet Manager.
# Requiere el laboratorio encendido. Solo toca el módulo ui_desktop; lab.yml down también lo destruye.
name: ui-desktop

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up: crear el escritorio · down: destruirlo"
        type: choice
        required: true
        options: [up, down]

concurrency:
  group: lab
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.14.5"
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_owner: ${{ vars.LAB_OWNER }}
  TF_VAR_ami_id: ${{ vars.LAB_AMI_ID }}
  TF_VAR_permissions_boundary_arn: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
  TF_VAR_grafana_cloud_aws_account_id: ${{ vars.GRAFANA_CLOUD_AWS_ACCOUNT_ID }}
  TF_VAR_grafana_cloudwatch_external_id: ${{ vars.GRAFANA_CLOUDWATCH_EXTERNAL_ID }}
  TF_VAR_enable_ui_desktop: "true"

jobs:
  desktop:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: lab
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Comprobar que el laboratorio está encendido
        run: |
          vpcs="$(aws ec2 describe-vpcs --filters Name=tag:Project,Values=agentic-platform --query 'length(Vpcs)' --output text)"
          if [ "$vpcs" = "0" ]; then
            echo "::error::El laboratorio no existe. Ejecuta primero lab.yml con up."
            exit 1
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: terraform plan (${{ inputs.action }})
        env:
          ACTION: ${{ inputs.action }}
        run: |
          destroy=""
          if [ "$ACTION" = "down" ]; then destroy="-destroy"; fi
          # shellcheck disable=SC2086
          terraform plan $destroy -target=module.ui_desktop -out=desktop.tfplan
      - name: terraform apply
        run: terraform apply desktop.tfplan
      - name: Resumen
        if: inputs.action == 'up'
        run: |
          {
            echo "### Escritorio creado"
            echo "Espera unos 10 minutos a que Windows arranque."
            echo ""
            echo "1. Contraseña, en CloudShell: \`aws ssm get-parameter --name /agentic-platform/cluster/ui-desktop-password --with-decryption --query Parameter.Value --output text\`"
            echo "2. AWS: Systems Manager → Fleet Manager → selecciona \`$(terraform output -raw ui_desktop_instance_id)\` → Node actions → Connect → Connect with Remote Desktop."
            echo "3. Usuario \`Administrator\` y esa contraseña."
            echo "4. En el escritorio, abre los accesos *Argo CD* y *Dapr Dashboard*."
          } >> "$GITHUB_STEP_SUMMARY"
