# Dashboards y datasource CloudWatch de Grafana Cloud (L-1, ADR-0001 §2).
# En develop solo planifica; aplica en main y en la ejecución manual desde main.
#
# Environment observability. Variables: AWS_ROLE_ARN (role/agentic-github-observability, solo
# el estado observability/*), TF_STATE_BUCKET, GRAFANA_URL, GRAFANA_CLOUDWATCH_ROLE_ARN.
# Secreto: GRAFANA_AUTH (token de service account de Grafana).
name: observability

on:
  push:
    branches: [main, develop]
    paths:
      - "observability/**"
      - ".github/workflows/observability.yml"
  workflow_dispatch:

concurrency:
  group: observability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: observability
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
      TF_VAR_cloudwatch_role_arn: ${{ vars.GRAFANA_CLOUDWATCH_ROLE_ARN }}
    defaults:
      run:
        working-directory: observability/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false
      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: terraform plan
        run: terraform plan -out=observability.tfplan
      - name: terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply observability.tfplan
