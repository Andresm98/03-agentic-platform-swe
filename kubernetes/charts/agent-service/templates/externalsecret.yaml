{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agent-service.secretName" . }}
  labels: {{- include "agent-service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "agent-service.secretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data: {{- toYaml .Values.externalSecret.template | nindent 8 }}
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef: { key: {{ .remoteKey }} }
    {{- end }}
{{- end }}
