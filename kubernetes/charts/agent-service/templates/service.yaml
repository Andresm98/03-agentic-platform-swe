apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-service.name" . }}
  labels: {{- include "agent-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "agent-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.containerPort }}
      targetPort: http
