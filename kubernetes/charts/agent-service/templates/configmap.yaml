apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-service.name" . }}
  labels: {{- include "agent-service.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ include "agent-service.name" . | quote }}
  PORT: {{ .Values.containerPort | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
