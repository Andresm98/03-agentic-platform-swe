[project]
name = "agentlib"
version = "0.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn>=0.54,<0.55",
  "httpx>=0.28,<0.29",
  "openai>=3.46,<4",
  "pydantic>=2.14,<3",
  "prometheus-client>=0.26,<0.27",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45,<2",
]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlib"]
