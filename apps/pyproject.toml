forbidden_modules = ["fastapi", "starlette", "dapr", "openai", "nats", "opentelemetry", "prometheus_client", "httpx", "httpx2", "pydantic", "uvicorn", "grpc", "agentlib.adapters", "agentlib.bootstrap", "agentlib.application"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "orchestrator.application: sin frameworks ni adaptadores"
type = "forbidden"
source_modules = ["orchestrator.application"]
forbidden_modules = ["fastapi", "starlette", "dapr", "openai", "nats", "opentelemetry", "prometheus_client", "httpx", "httpx2", "pydantic", "uvicorn", "grpc", "agentlib.adapters", "agentlib.bootstrap"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
