# Workspace uv de la flota agéntica (equipo A).
# Runtime: la imagen distroless python3-debian12 trae Python 3.11.2 (verificado), por eso el
# código y el lock apuntan a 3.11 y el builder de Docker usa python:3.11-slim-bookworm.
[project]
name = "agentic-fleet-workspace"
version = "0.0.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=7.0,<8",
  "ruff>=0.17,<0.18",
  "mypy>=1.18,<3",
  "import-linter>=2.3,<3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "common/agentlib",
  "agents/orchestrator",
  "agents/researcher",
  "agents/analyst",
  "agents/executor",
  "llm-gateway",
  "fake-llm",
]

[tool.uv.sources]
agentlib = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["E501", "S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["agentlib", "orchestrator", "researcher", "analyst", "executor", "llm_gateway", "fake_llm"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.importlinter]
root_packages = ["agentlib", "orchestrator", "researcher", "analyst", "executor", "llm_gateway", "fake_llm"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "agentlib: capas (dependencias solo hacia dentro)"
type = "layers"
containers = ["agentlib"]
layers = ["bootstrap", "adapters", "application", "domain"]

[[tool.importlinter.contracts]]
name = "agentlib.domain: sin frameworks ni adaptadores"
type = "forbidden"
source_modules = ["agentlib.domain"]
forbidden_modules = ["fastapi", "starlette", "dapr", "openai", "nats", "opentelemetry", "prometheus_client", "httpx", "httpx2", "pydantic", "uvicorn", "grpc"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "agentlib.application: sin frameworks ni adaptadores"
type = "forbidden"
source_modules = ["agentlib.application"]
forbidden_modules = ["fastapi", "starlette", "dapr", "openai", "nats", "opentelemetry", "prometheus_client", "httpx", "httpx2", "pydantic", "uvicorn", "grpc"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "orchestrator: capas (dependencias solo hacia dentro)"
