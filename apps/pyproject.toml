[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false
disallow_any_generics = false
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "common/agentlib/src:agents/orchestrator/src:agents/researcher/src:agents/analyst/src:agents/executor/src:llm-gateway/src:fake-llm/src"
