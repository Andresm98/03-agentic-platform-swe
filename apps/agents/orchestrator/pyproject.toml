[project]
name = "orchestrator"
version = "0.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "agentlib",
  "dapr>=1.19,<1.20",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
agentlib = { workspace = true }
