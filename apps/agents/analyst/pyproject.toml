[project]
name = "analyst"
version = "0.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "agentlib",
]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.uv.sources]
agentlib = { workspace = true }
