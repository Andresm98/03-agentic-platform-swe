# fake-llm (sync-wave 10).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-fake-llm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/part-of: agentic-platform
    agentic.io/layer: fleet
    agentic.io/github-deployment: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Andresm98/03-agentic-platform-swe.git
    targetRevision: main
    path: kubernetes/charts/agent-service
    helm:
      releaseName: fake-llm
      valueFiles:
        - ../../../gitops/apps/fake-llm/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
