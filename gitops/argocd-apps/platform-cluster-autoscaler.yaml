# Cluster Autoscaler (minor 1.35).
# Generado con la misma plantilla que el resto de platform-*.yaml: values comunes en
# gitops/platform/cluster-autoscaler/, overlay por cluster en gitops/clusters/<cluster>/values/cluster-autoscaler.yaml.
# Solo AWS: el overlay local-k3d lo excluye (gitops/clusters/local-k3d/kustomization.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cluster-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  labels:
    app.kubernetes.io/part-of: agentic-platform
    agentic.io/layer: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: cluster-autoscaler
      targetRevision: 9.59.0
      helm:
        releaseName: cluster-autoscaler
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/gitops/platform/cluster-autoscaler/values.yaml
          - $values/gitops/clusters/aws-lab/values/cluster-autoscaler.yaml
    - repoURL: https://github.com/Andresm98/03-agentic-platform-swe.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
