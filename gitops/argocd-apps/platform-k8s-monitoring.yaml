# Alloy (k8s-monitoring) -> Grafana Cloud.
# Generado con la misma plantilla que el resto de platform-*.yaml: values comunes en
# gitops/platform/k8s-monitoring/, overlay por cluster en gitops/clusters/<cluster>/values/k8s-monitoring.yaml.
# Solo AWS: el overlay local-k3d lo excluye (gitops/clusters/local-k3d/kustomization.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-k8s-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: agentic-platform
    agentic.io/layer: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: k8s-monitoring
      targetRevision: 4.6.0
      helm:
        releaseName: k8s-monitoring
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/gitops/platform/k8s-monitoring/values.yaml
          - $values/gitops/clusters/aws-lab/values/k8s-monitoring.yaml
    - repoURL: https://github.com/Andresm98/03-agentic-platform-swe.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Andresm98/03-agentic-platform-swe.git
      targetRevision: main
      path: gitops/platform/k8s-monitoring/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
