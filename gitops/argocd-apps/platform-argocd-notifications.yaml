# Argo CD Notifications -> GitHub Deployments (GitHub App).
# Generado con la misma plantilla que el resto de platform-*.yaml: values comunes en
# gitops/platform/argocd-notifications/, overlay por cluster en gitops/clusters/<cluster>/values/argocd-notifications.yaml.
# Solo AWS: el overlay local-k3d lo excluye (gitops/clusters/local-k3d/kustomization.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-argocd-notifications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: agentic-platform
    agentic.io/layer: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/Andresm98/03-agentic-platform-swe.git
      targetRevision: main
      path: gitops/platform/argocd-notifications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
