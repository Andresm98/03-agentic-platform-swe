# Trazado de los sidecars hacia Alloy (OTLP) -> Grafana Cloud Traces.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: tracing
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: alloy-otlp.monitoring.svc.cluster.local:4317
      isSecure: false
      protocol: grpc
  metric:
    enabled: true
