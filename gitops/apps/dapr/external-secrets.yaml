# Credenciales de los componentes y del Job (CONTRACTS §5 y §6).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target: { name: redis-auth, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: /agentic-platform/k8s/redis-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jetstream-setup
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-ssm }
  target: { name: jetstream-setup, creationPolicy: Owner }
  data:
    # El usuario orchestrator es el único de NATS con permiso sobre todo $JS.API.
    - secretKey: NATS_PASSWORD
      remoteRef: { key: /agentic-platform/k8s/nats/orchestrator-password }
