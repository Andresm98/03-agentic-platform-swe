# Overlay aws-lab de External Secrets: credenciales AWS.
# AWS_CONFIG_FILE (role_arn = agentic-external-secrets, credential_source = Ec2InstanceMetadata)
# montado desde el ConfigMap que crea el bootstrap L1 (kubernetes/bootstrap/
# aws-controller-config.yaml.tftpl). Por eso ESO corre solo en el control plane (IMDS hop 2).
extraEnv:
  - name: AWS_CONFIG_FILE
    value: /etc/aws/config
  - name: AWS_SDK_LOAD_CONFIG
    value: "1"
  - name: AWS_REGION
    value: us-east-1

extraVolumes:
  - name: aws-config
    configMap:
      name: agentic-aws-external-secrets
      optional: true

extraVolumeMounts:
  - name: aws-config
    mountPath: /etc/aws
    readOnly: true
