# En AWS, root recorre gitops/argocd-apps entero. En local, root apunta a este overlay,
# así que la flota (fleet-*.yaml del equipo A) entra por esta Application intermedia.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  labels:
    app.kubernetes.io/part-of: agentic-platform
spec:
  project: default
  source:
    repoURL: https://github.com/Andresm98/03-agentic-platform-swe.git
    targetRevision: main
    path: gitops/argocd-apps
    directory:
      recurse: true
      include: "fleet-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
