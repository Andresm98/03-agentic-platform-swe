# Accesos internos a las interfaces para el escritorio de ui-desktop.yml. El Security Group del
# control plane solo abre estos puertos cuando el escritorio existe: no son accesibles desde Internet.
apiVersion: v1
kind: Service
metadata:
  name: argocd-ui
  namespace: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: argo-cd
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: dapr-dashboard-ui
  namespace: dapr-system
spec:
  type: NodePort
  selector:
    app: dapr-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30082
