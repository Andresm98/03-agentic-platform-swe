# Credenciales de la GitHub App (Deployments: write, Commit statuses: write, sin contenido).
# SSM /agentic-platform/k8s/github-app = JSON {appID, installationID, privateKey}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: github-appID
      remoteRef: { key: /agentic-platform/k8s/github-app, property: appID }
    - secretKey: github-installationID
      remoteRef: { key: /agentic-platform/k8s/github-app, property: installationID }
    - secretKey: github-privateKey
      remoteRef: { key: /agentic-platform/k8s/github-app, property: privateKey }
