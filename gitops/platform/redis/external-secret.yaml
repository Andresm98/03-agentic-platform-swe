# Secret redis-auth, clave password (CONTRACTS §5). A crea el suyo en ns apps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: redis-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: /agentic-platform/k8s/redis-password }
