# Contraseñas de los usuarios NATS (CONTRACTS §6: /agentic-platform/k8s/nats/<servicio>-password).
# Las lee el StatefulSet de NATS como env. El equipo A crea sus propios ExternalSecret en
# ns apps para los clientes (sidecars Dapr / gateway).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-users
  namespace: nats
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: nats-users
    creationPolicy: Owner
  data:
    - secretKey: orchestrator
      remoteRef: { key: /agentic-platform/k8s/nats/orchestrator-password }
    - secretKey: researcher
      remoteRef: { key: /agentic-platform/k8s/nats/researcher-password }
    - secretKey: analyst
      remoteRef: { key: /agentic-platform/k8s/nats/analyst-password }
    - secretKey: executor
      remoteRef: { key: /agentic-platform/k8s/nats/executor-password }
    - secretKey: llm-gateway
      remoteRef: { key: /agentic-platform/k8s/nats/llm-gateway-password }
    - secretKey: fake-llm
      remoteRef: { key: /agentic-platform/k8s/nats/fake-llm-password }
