# ClusterSecretStore aws-ssm (CONTRACTS §5). Sin bloque auth: el controlador usa la
# cadena por defecto del SDK, que lee AWS_CONFIG_FILE y asume role/agentic-external-secrets
# (AssumeRole con credential_source=Ec2InstanceMetadata, ADR-0002 §2).
# Los ExternalSecret usan remoteRef.key = ruta SSM completa (p. ej. /agentic-platform/k8s/redis-password).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
