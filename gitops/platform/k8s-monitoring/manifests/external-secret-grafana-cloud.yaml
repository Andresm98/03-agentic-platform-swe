# Credenciales de Grafana Cloud para Alloy. SSM /agentic-platform/k8s/grafana-cloud es un
# JSON con las claves: prom_url, prom_user, loki_url, loki_user, otlp_url, otlp_user, token
# (ver infra/scripts/seed-secrets.sh). dataFrom.extract las convierte en claves del Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: grafana-cloud
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /agentic-platform/k8s/grafana-cloud
